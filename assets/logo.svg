<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="35%" style="stop-color:#111128"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <!-- Claw slash gradient -->
    <linearGradient id="claw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d55"/>
      <stop offset="50%" style="stop-color:#ff6b81"/>
      <stop offset="100%" style="stop-color:#ff2d55"/>
    </linearGradient>
    <!-- Lens outer gradient -->
    <linearGradient id="lens-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="50%" style="stop-color:#ff2d55"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <!-- Lens inner gradient -->
    <radialGradient id="lens-inner" cx="45%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#2a1a4e"/>
      <stop offset="60%" style="stop-color:#120a28"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </radialGradient>
    <!-- Lens iris gradient -->
    <radialGradient id="lens-iris" cx="42%" cy="38%" r="50%">
      <stop offset="0%" style="stop-color:#c471f5"/>
      <stop offset="40%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff2d55"/>
    </radialGradient>
    <!-- Camera body gradient -->
    <linearGradient id="cam-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3f"/>
      <stop offset="100%" style="stop-color:#12122a"/>
    </linearGradient>
    <!-- Shutter button gradient -->
    <radialGradient id="shutter-grad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ff4466"/>
      <stop offset="100%" style="stop-color:#cc1133"/>
    </radialGradient>
    <!-- Glow filter for neon effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow for camera -->
    <filter id="cam-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- Sparkle cross pattern -->
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="800" height="800" rx="48" fill="url(#bg-grad)"/>

  <!-- Subtle grid overlay -->
  <g opacity="0.025" stroke="white" stroke-width="0.5">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="640" x2="800" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
  </g>

  <!-- ══ AMBIENT GLOW (large, fills background) ══ -->
  <ellipse cx="400" cy="330" rx="340" ry="280" fill="#7b2ff7" opacity="0.05"/>
  <ellipse cx="400" cy="330" rx="240" ry="200" fill="#ff2d55" opacity="0.04"/>
  <ellipse cx="400" cy="330" rx="160" ry="140" fill="#c471f5" opacity="0.03"/>

  <!-- ══ CLAW MARKS (large, dramatic, top-left sweeping to center) ══ -->
  <g filter="url(#glow-strong)" opacity="0.95">
    <!-- Slash 1 (thickest, deepest) -->
    <path d="M 40 30 Q 100 90 180 160 Q 240 220 310 280" stroke="url(#claw-grad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 312 282 L 326 270 L 320 292 Z" fill="#ff2d55"/>
    <!-- Slash 2 (medium) -->
    <path d="M 100 15 Q 160 75 250 150 Q 310 210 380 260" stroke="url(#claw-grad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 382 262 L 396 249 L 390 272 Z" fill="#ff2d55"/>
    <!-- Slash 3 (thinnest, fastest) -->
    <path d="M 165 5 Q 225 60 320 140 Q 380 195 440 240" stroke="url(#claw-grad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 442 242 L 456 229 L 450 252 Z" fill="#ff2d55"/>
  </g>

  <!-- Scratch marks (thin lines following slashes) -->
  <g stroke="#ff2d55" stroke-width="1.5" opacity="0.25" stroke-linecap="round">
    <line x1="55" y1="55" x2="160" y2="150"/>
    <line x1="115" y1="40" x2="230" y2="140"/>
    <line x1="180" y1="30" x2="300" y2="130"/>
    <line x1="70" y1="80" x2="140" y2="145"/>
    <line x1="200" y1="15" x2="280" y2="85"/>
  </g>

  <!-- Claw mark debris particles -->
  <g fill="#ff2d55" opacity="0.4">
    <circle cx="320" cy="285" r="2.5"/>
    <circle cx="390" cy="268" r="2"/>
    <circle cx="448" cy="248" r="1.8"/>
    <circle cx="280" cy="255" r="1.5"/>
    <circle cx="350" cy="240" r="1.2"/>
  </g>

  <!-- ══ CAMERA BODY (full-width, dominant) ══ -->
  <g filter="url(#cam-shadow)">
    <!-- Main body -->
    <rect x="70" y="210" width="660" height="340" rx="40" fill="url(#cam-body)" stroke="#2a2a5e" stroke-width="2.5"/>
    <!-- Top accent bar (neon purple) -->
    <rect x="70" y="210" width="660" height="7" rx="3.5" fill="#7b2ff7" opacity="0.5"/>
    <!-- Bottom accent line -->
    <rect x="70" y="543" width="660" height="3" rx="1.5" fill="#ff2d55" opacity="0.15"/>

    <!-- Viewfinder bump (larger) -->
    <rect x="280" y="180" width="160" height="38" rx="10" fill="#1a1a3a" stroke="#2a2a5e" stroke-width="2"/>
    <rect x="316" y="188" width="88" height="22" rx="5" fill="#0a0a1a" stroke="#3a3a6e" stroke-width="0.8"/>
    <!-- Viewfinder glass -->
    <rect x="326" y="193" width="68" height="12" rx="3" fill="#1a1a3a"/>
    <rect x="330" y="195" width="24" height="8" rx="2" fill="#7b2ff7" opacity="0.15"/>

    <!-- Mode dial (top-left of camera) -->
    <circle cx="170" cy="195" r="24" fill="#1a1a3a" stroke="#2a2a5e" stroke-width="2"/>
    <circle cx="170" cy="195" r="18" fill="#0f0f28" stroke="#3a3a6e" stroke-width="0.8"/>
    <!-- Dial notches -->
    <g stroke="#4a4a7e" stroke-width="1.5" stroke-linecap="round">
      <line x1="170" y1="179" x2="170" y2="183"/>
      <line x1="170" y1="207" x2="170" y2="211"/>
      <line x1="154" y1="195" x2="158" y2="195"/>
      <line x1="182" y1="195" x2="186" y2="195"/>
    </g>
    <!-- Mode indicator dot -->
    <circle cx="170" cy="183" r="2" fill="#ff2d55"/>

    <!-- Shutter button (top-right of camera) -->
    <circle cx="620" cy="195" r="20" fill="url(#shutter-grad)" stroke="#cc1133" stroke-width="1.5"/>
    <circle cx="620" cy="195" r="14" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>
    <!-- Shutter highlight -->
    <ellipse cx="616" cy="190" rx="6" ry="4" fill="white" opacity="0.2"/>

    <!-- Hot shoe mount (top center) -->
    <rect x="370" y="175" width="60" height="8" rx="2" fill="#1e1e3f" stroke="#2a2a5e" stroke-width="0.8"/>
    <rect x="382" y="172" width="36" height="5" rx="1.5" fill="#2a2a5e"/>
  </g>

  <!-- ══ CAMERA LENS (massive, centered, dominant) ══ -->
  <!-- Outer glow ring -->
  <circle cx="400" cy="380" r="150" fill="none" stroke="url(#lens-outer)" stroke-width="4" opacity="0.3" filter="url(#glow-intense)"/>
  <!-- Outer ring with gradient -->
  <circle cx="400" cy="380" r="138" fill="none" stroke="url(#lens-outer)" stroke-width="10" filter="url(#glow)"/>
  <!-- Ring detail 1 -->
  <circle cx="400" cy="380" r="126" fill="none" stroke="#2a2a5e" stroke-width="4"/>
  <!-- Ring detail 2 (focus ring texture) -->
  <g opacity="0.12" stroke="#4a4a7e" stroke-width="1">
    <circle cx="400" cy="380" r="122" fill="none" stroke-dasharray="4 6"/>
  </g>
  <!-- Lens body -->
  <circle cx="400" cy="380" r="114" fill="url(#lens-inner)"/>
  <!-- Inner ring 1 -->
  <circle cx="400" cy="380" r="98" fill="none" stroke="#1e1e3f" stroke-width="2"/>
  <!-- Iris ring (glowing) -->
  <circle cx="400" cy="380" r="80" fill="none" stroke="url(#lens-iris)" stroke-width="6" opacity="0.8"/>
  <!-- Inner iris fill -->
  <circle cx="400" cy="380" r="62" fill="url(#lens-iris)" opacity="0.65"/>
  <!-- Inner ring 2 -->
  <circle cx="400" cy="380" r="48" fill="none" stroke="#7b2ff7" stroke-width="1.5" opacity="0.4"/>
  <!-- Deep center (pupil) -->
  <circle cx="400" cy="380" r="36" fill="#0a0a1a"/>
  <!-- Center glow dot -->
  <circle cx="400" cy="380" r="8" fill="#7b2ff7" opacity="0.15"/>

  <!-- Aperture blades (12-blade pattern, larger) -->
  <g opacity="0.12" fill="none" stroke="#c471f5" stroke-width="1">
    <!-- Cardinal -->
    <line x1="400" y1="330" x2="400" y2="346"/>
    <line x1="400" y1="414" x2="400" y2="430"/>
    <line x1="350" y1="380" x2="366" y2="380"/>
    <line x1="434" y1="380" x2="450" y2="380"/>
    <!-- Diagonal -->
    <line x1="365" y1="345" x2="376" y2="356"/>
    <line x1="424" y1="404" x2="435" y2="415"/>
    <line x1="365" y1="415" x2="376" y2="404"/>
    <line x1="424" y1="356" x2="435" y2="345"/>
    <!-- Sub-diagonal -->
    <line x1="380" y1="334" x2="386" y2="348"/>
    <line x1="414" y1="412" x2="420" y2="426"/>
    <line x1="354" y1="360" x2="368" y2="366"/>
    <line x1="432" y1="394" x2="446" y2="400"/>
  </g>

  <!-- Highlight reflections (glass effect, multiple) -->
  <ellipse cx="372" cy="348" rx="22" ry="14" fill="white" opacity="0.22" transform="rotate(-30 372 348)"/>
  <circle cx="362" cy="342" r="8" fill="white" opacity="0.35"/>
  <circle cx="354" cy="352" r="3.5" fill="white" opacity="0.25"/>
  <!-- Secondary reflection (bottom-right) -->
  <ellipse cx="438" cy="412" rx="10" ry="6" fill="white" opacity="0.08" transform="rotate(30 438 412)"/>
  <circle cx="444" cy="418" r="3" fill="white" opacity="0.06"/>

  <!-- ══ CAMERA DETAILS (full-size) ══ -->
  <!-- Flash unit (larger) -->
  <rect x="608" y="232" width="60" height="30" rx="8" fill="#ff2d55" opacity="0.85"/>
  <rect x="614" y="238" width="48" height="18" rx="5" fill="white" opacity="0.15"/>
  <!-- Flash icon lines -->
  <g stroke="white" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <line x1="630" y1="243" x2="642" y2="243"/>
    <line x1="632" y1="248" x2="640" y2="248"/>
    <line x1="634" y1="253" x2="638" y2="253"/>
  </g>

  <!-- AF illuminator (secondary sensor) -->
  <circle cx="628" cy="290" r="12" fill="#0a0a1a" stroke="#3a3a6e" stroke-width="1.5"/>
  <circle cx="628" cy="290" r="7" fill="#1a1a3a"/>
  <circle cx="628" cy="290" r="3" fill="#7b2ff7" opacity="0.3"/>

  <!-- Brand line on camera body -->
  <rect x="110" y="510" width="120" height="4" rx="2" fill="#ff2d55" opacity="0.35"/>
  <!-- Secondary brand dots -->
  <g fill="#ff2d55" opacity="0.25">
    <circle cx="250" cy="512" r="2"/>
    <circle cx="262" cy="512" r="2"/>
    <circle cx="274" cy="512" r="2"/>
  </g>

  <!-- Grip texture (right side, full height) -->
  <g opacity="0.06" stroke="white" stroke-width="1.2">
    <line x1="688" y1="240" x2="688" y2="520"/>
    <line x1="695" y1="240" x2="695" y2="520"/>
    <line x1="702" y1="240" x2="702" y2="520"/>
    <line x1="709" y1="240" x2="709" y2="520"/>
    <line x1="716" y1="245" x2="716" y2="515"/>
  </g>

  <!-- Strap lug (left) -->
  <rect x="78" y="270" width="12" height="20" rx="3" fill="#1a1a3a" stroke="#2a2a5e" stroke-width="1"/>
  <!-- Strap lug (right) -->
  <rect x="710" y="270" width="12" height="20" rx="3" fill="#1a1a3a" stroke="#2a2a5e" stroke-width="1"/>

  <!-- ══ SELFIE SPARKLES (top-right cluster, bigger) ══ -->
  <g filter="url(#glow)">
    <use href="#sparkle" x="620" y="70" width="28" height="28" opacity="0.9"/>
    <use href="#sparkle" x="690" y="40" width="22" height="22" opacity="0.7"/>
    <use href="#sparkle" x="575" y="45" width="20" height="20" opacity="0.65"/>
    <use href="#sparkle" x="680" y="110" width="18" height="18" opacity="0.5"/>
    <use href="#sparkle" x="730" y="80" width="14" height="14" opacity="0.4"/>
    <use href="#sparkle" x="560" y="100" width="12" height="12" opacity="0.35"/>
  </g>
  <!-- Sparkle dots -->
  <g fill="white" opacity="0.35">
    <circle cx="550" cy="65" r="2"/>
    <circle cx="750" cy="55" r="2.5"/>
    <circle cx="640" cy="130" r="1.5"/>
    <circle cx="710" cy="140" r="1.8"/>
    <circle cx="600" cy="140" r="1"/>
    <circle cx="760" cy="110" r="1.2"/>
  </g>

  <!-- ══ BOTTOM-LEFT ACCENTS (concentric rings, larger) ══ -->
  <g opacity="0.12" filter="url(#glow)">
    <circle cx="80" cy="720" r="60" fill="none" stroke="#7b2ff7" stroke-width="1.5"/>
    <circle cx="80" cy="720" r="40" fill="none" stroke="#7b2ff7" stroke-width="1"/>
    <circle cx="80" cy="720" r="20" fill="none" stroke="#c471f5" stroke-width="0.5"/>
  </g>
  <!-- Bottom-right accent -->
  <g opacity="0.08" filter="url(#glow)">
    <circle cx="740" cy="740" r="45" fill="none" stroke="#ff2d55" stroke-width="1"/>
    <circle cx="740" cy="740" r="28" fill="none" stroke="#ff2d55" stroke-width="0.8"/>
  </g>

  <!-- ══ CIRCUIT LINES (all corners, fuller) ══ -->
  <g stroke="#7b2ff7" stroke-width="1.2" opacity="0.1" fill="none">
    <!-- Bottom-left -->
    <path d="M 20 630 L 70 630 L 100 600"/>
    <path d="M 30 660 L 60 660 L 80 640"/>
    <circle cx="70" cy="630" r="3.5" fill="#7b2ff7"/>
    <!-- Bottom-right -->
    <path d="M 700 630 L 750 630 L 780 660"/>
    <path d="M 720 650 L 760 650 L 780 670"/>
    <circle cx="750" cy="630" r="3.5" fill="#7b2ff7"/>
    <!-- Top-right (behind sparkles) -->
    <path d="M 750 160 L 750 120 L 770 100"/>
    <circle cx="750" cy="160" r="2.5" fill="#7b2ff7"/>
  </g>

  <!-- ══ TYPOGRAPHY (full-width, bold) ══ -->
  <!-- CLAWRA main title -->
  <text x="400" y="640" text-anchor="middle" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif" font-size="88" font-weight="900" fill="white" letter-spacing="12" filter="url(#glow)">CLAWRA</text>
  <!-- Underline accent (wider) -->
  <rect x="180" y="660" width="440" height="3" rx="1.5" fill="url(#claw-grad)" opacity="0.6"/>
  <!-- Subtitle -->
  <text x="400" y="705" text-anchor="middle" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#ff2d55" letter-spacing="14" opacity="0.9">ZEROCLAW</text>
  <!-- Tagline -->
  <text x="400" y="745" text-anchor="middle" font-family="'SF Pro Text', 'Inter', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#8888aa" letter-spacing="4">SELFIE SUPERPOWERS FOR AI AGENTS</text>

  <!-- ══ VERSION BADGE (bottom-right) ══ -->
  <g transform="translate(660, 770)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#1a1a3a" stroke="#2a2a5e" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#7b2ff7">v1.0.0</text>
  </g>

  <!-- ══ RUST BADGE (bottom-left) ══ -->
  <g transform="translate(60, 770)">
    <rect x="0" y="0" width="60" height="22" rx="11" fill="#1a1a3a" stroke="#2a2a5e" stroke-width="1"/>
    <text x="30" y="15" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#ff6b81">Rust</text>
  </g>
</svg>
